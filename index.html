<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>qPCR Calculator</title>
<style>
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --border: #dde1e6;
    --text: #1a1f25;
    --text2: #5c6470;
    --accent: #2563eb;
    --accent2: #1e40af;
    --good: #059669;
    --warn: #d97706;
    --bad: #dc2626;
    --radius: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    padding: 24px;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { color: var(--text2); font-size: 13px; margin-bottom: 20px; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel-title { font-weight: 600; font-size: 14px; margin-bottom: 12px; }
  table { border-collapse: collapse; width: 100%; }
  th, td {
    border: 1px solid var(--border);
    padding: 6px 8px;
    text-align: left;
    font-size: 13px;
    vertical-align: middle;
  }
  th {
    background: #f1f3f5;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
  }
  td.result { background: #fafbfc; }
  input[type="text"], input[type="number"], select {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    padding: 4px 6px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    outline: none;
    border-radius: 3px;
  }
  input:hover { border-color: var(--border); }
  input:focus { border-color: var(--accent); background: var(--surface); }
  input.invalid { border-color: var(--bad); background: #fef2f2; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 6px 12px;
    font-size: 13px;
    border-radius: var(--radius);
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: #f1f3f5; }
  .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent2); }
  .btn-danger { color: var(--bad); }
  .btn-danger:hover { background: #fef2f2; border-color: var(--bad); }
  .row-actions { display: flex; gap: 4px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .formula {
    background: #f8f9fa;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 16px;
    line-height: 1.8;
  }
  .formula code {
    background: #e9ecef;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 12px;
    color: var(--text);
  }
  .tc-hint { color: var(--text2); font-size: 12px; margin-top: 8px; }
  .tc-hint code { background: #e9ecef; padding: 1px 4px; border-radius: 2px; font-size: 11px; }
  .chart-wrap { width: 100%; margin-bottom: 16px; }
  .chart-wrap svg { width: 100%; height: auto; display: block; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; font-size: 12px; color: var(--text); }
  .legend-item { display: inline-flex; align-items: center; gap: 5px; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
  .chart-title { font-weight: 600; font-size: 13px; margin-bottom: 8px; color: var(--text); }
  .chart-toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 10px;
  }
  .chart-toolbar .btn { padding: 4px 10px; font-size: 12px; }
  .axis-editor {
    display: none;
    margin-bottom: 10px;
    padding: 10px;
    background: #f8f9fa;
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .axis-editor.show { display: block; }
  .axis-editor textarea {
    width: 100%;
    min-height: 70px;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text);
    resize: vertical;
    outline: none;
  }
  .axis-editor textarea:focus { border-color: var(--accent); }
  .axis-editor label {
    display: block;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 4px;
  }
  .chart-title-input {
    border: 1px solid transparent;
    background: transparent;
    padding: 3px 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    outline: none;
    border-radius: 3px;
    font-family: inherit;
    min-width: 220px;
    flex: 1;
    max-width: 420px;
  }
  .chart-title-input:hover { border-color: var(--border); }
  .chart-title-input:focus { border-color: var(--accent); background: var(--surface); }
  .fold-up { color: var(--bad); font-weight: 600; }
  .fold-down { color: var(--good); font-weight: 600; }
  .fold-neutral { color: var(--text2); }
  .copy-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: white;
    padding: 8px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 100;
  }
  .copy-toast.show { opacity: 1; }
  @media print {
    .toolbar, .btn { display: none; }
    body { padding: 0; background: white; }
    .panel { border: none; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>qPCR Calculator</h1>
  <div class="subtitle">输入 Ct 值，自动计算 ΔCt、ΔΔCt 和相对表达量 (2^-ΔΔCt)</div>

  <div class="formula">
    <b>计算公式</b>：<br>
    ΔCt = Ct<sub>目的基因</sub> - Ct<sub>内参基因</sub> &nbsp;&nbsp;
    ΔΔCt = ΔCt<sub>处理组</sub> - ΔCt<sub>对照组</sub> &nbsp;&nbsp;
    Fold Change = 2<sup>-ΔΔCt</sup><br>
    <span style="color:var(--text2); font-size:12px;">对照组下拉框中选择基准样品，默认用第一行。结果 > 1 上调，< 1 下调。</span>
  </div>

  <div class="panel">
    <div class="panel-title">输入数据</div>
    <div class="toolbar">
      <button class="btn" onclick="addRow()">+ 添加样品</button>
      <button class="btn" onclick="addColumn()">+ 添加目的基因</button>
      <button class="btn btn-danger" onclick="clearAll()">清空</button>
      <span style="flex:1"></span>
      <button class="btn btn-primary" onclick="copyResults()">复制结果</button>
      <button class="btn" onclick="window.print()">打印</button>
    </div>
    <div style="overflow-x:auto;">
      <table id="inputTable">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="tc-hint">
      Ct 值直接输入数字即可（如 <code>22.48</code>）；如有技术重复，用逗号分隔（如 <code>22.1,22.3,22.4</code>），程序会自动取平均并计算 SEM。空白或非数字的单元格会被跳过，不参与计算。
    </div>
  </div>

  <div class="panel" id="resultPanel" style="display:none;">
    <div class="panel-title">计算结果</div>
    <div class="tc-hint" id="resultHint" style="margin-bottom:8px;"></div>
    <div style="overflow-x:auto;">
      <table id="resultTable">
        <thead id="rthead"></thead>
        <tbody id="rtbody"></tbody>
      </table>
    </div>
    <div class="tc-hint" id="controlLabel" style="margin-top:8px;"></div>
  </div>

  <div class="panel" id="chartPanel" style="display:none;">
    <div class="panel-title">柱形图</div>
    <div class="chart-toolbar">
      <input type="text" class="chart-title-input" id="titleBySample" value="按样品分组" placeholder="图标题">
      <button class="btn" onclick="saveChartAsPng('chartBySample','按样品分组')">保存 PNG</button>
      <button class="btn" onclick="saveChartAsSvg('chartBySample','按样品分组')">下载 SVG</button>
      <button class="btn" onclick="toggleAxisEditor('sample')">编辑横轴</button>
    </div>
    <div class="axis-editor" id="axisEditorSample">
      <label>每行一个横轴标签（顺序对应样品顺序，留空则用样品名）</label>
      <textarea id="axisLabelsSample" placeholder="0H&#10;12H&#10;24H"></textarea>
    </div>
    <div class="chart-legend" id="legendBySample"></div>
    <div class="chart-wrap" id="chartBySample"></div>
    <div class="chart-toolbar" id="geneChartToolbar" style="margin-top:16px;">
      <input type="text" class="chart-title-input" id="titleByGene" value="按基因分组" placeholder="图标题">
      <button class="btn" onclick="saveChartAsPng('chartByGene','按基因分组')">保存 PNG</button>
      <button class="btn" onclick="saveChartAsSvg('chartByGene','按基因分组')">下载 SVG</button>
      <button class="btn" onclick="toggleAxisEditor('gene')">编辑横轴</button>
    </div>
    <div class="axis-editor" id="axisEditorGene">
      <label>每行一个横轴标签（顺序对应基因顺序，留空则用基因名）</label>
      <textarea id="axisLabelsGene" placeholder="CNNM1&#10;GAPDH"></textarea>
    </div>
    <div class="chart-legend" id="legendByGene"></div>
    <div class="chart-wrap" id="chartByGene"></div>
    <div class="tc-hint" id="chartHint" style="margin-top:4px;"></div>
  </div>
</div>

<div class="copy-toast" id="copyToast">已复制到剪贴板</div>

<script>
"use strict";

let targetGenes = ["CNNM1"];
let rows = [];
let controlIndex = 0;
let nextId = 1;

function esc(s) {
  return String(s).replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">");
}

function initDefault() {
  rows = [];
  const defaults = [
    { name: "0H",   ref: "12.88", targets: ["22.48"] },
    { name: "12H",  ref: "13.81", targets: ["22.35"] },
    { name: "24H",  ref: "12.99", targets: ["22.18"] },
  ];
  for (const d of defaults) {
    rows.push({ id: nextId++, name: d.name, ref: d.ref, targets: [...d.targets] });
  }
}

function renderHead() {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <th style="width:40px;">#</th>
    <th style="min-width:100px;">样品名</th>
    <th style="width:50px;">对照</th>
    <th style="min-width:90px;">内参 Ct</th>
    ${targetGenes.map((g,i)=>`<th style="min-width:90px;">${esc(g)} Ct</th>`).join("")}
    <th style="width:60px;">操作</th>
  `;
  document.getElementById("thead").replaceChildren(tr);
}

function renderBody() {
  const tb = document.getElementById("tbody");
  tb.replaceChildren();
  rows.forEach((row, ri) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td style="text-align:center;color:var(--text2);">${ri+1}</td>
      <td><input type="text" data-row="${ri}" data-field="name" value="${esc(row.name)}" placeholder="样品名"></td>
      <td style="text-align:center;"><input type="radio" name="ctrl" data-row="${ri}" ${ri===controlIndex?"checked":""} style="width:auto;cursor:pointer;" title="选为对照"></td>
      <td><input type="text" inputmode="decimal" data-row="${ri}" data-field="ref" value="${esc(row.ref)}" placeholder="如 15.2"></td>
      ${row.targets.map((v,ti)=>`<td><input type="text" inputmode="decimal" data-row="${ri}" data-target="${ti}" value="${esc(v)}" placeholder="Ct"></td>`).join("")}
      <td>
        <div class="row-actions">
          <button class="btn btn-danger" style="padding:3px 8px;" onclick="removeRow(${ri})" title="删除此行">&times;</button>
        </div>
      </td>
    `;
    tb.appendChild(tr);
  });
  // event delegation
  tb.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", onInput);
    inp.addEventListener("focus", e => e.target.select());
  });
}

function onInput(e) {
  const t = e.target;
  const ri = +t.dataset.row;
  if (t.dataset.field === "name") rows[ri].name = t.value;
  else if (t.dataset.field === "ref") rows[ri].ref = t.value;
  else if (t.dataset.target !== undefined) rows[ri].targets[+t.dataset.target] = t.value;
  t.classList.remove("invalid");
  compute();
}

document.addEventListener("change", e => {
  if (e.target.name === "ctrl") {
    controlIndex = +e.target.dataset.row;
    compute();
  }
});

function addRow() {
  rows.push({ id: nextId++, name: "", ref: "", targets: targetGenes.map(()=> "") });
  renderBody();
  const inputs = document.querySelectorAll('#tbody input[data-field="name"]');
  if (inputs.length) inputs[inputs.length-1].focus();
}

function addColumn() {
  const name = prompt("目的基因名称:", "Gene" + (targetGenes.length+1));
  if (!name) return;
  targetGenes.push(name);
  rows.forEach(r => r.targets.push(""));
  renderHead();
  renderBody();
  compute();
}

function removeRow(i) {
  rows.splice(i, 1);
  if (controlIndex >= rows.length) controlIndex = Math.max(0, rows.length - 1);
  renderBody();
  compute();
}

function clearAll() {
  rows = [{ id: nextId++, name: "", ref: "", targets: targetGenes.map(()=> "") }];
  controlIndex = 0;
  renderBody();
  compute();
}

function parseCt(v) {
  if (v == null || String(v).trim() === "") return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

// Support comma-separated technical replicates, e.g. "22.1,22.3,22.4"
function parseCtStats(v) {
  if (v == null || String(v).trim() === "") return null;
  const parts = String(v).split(/[,;]/).map(s => s.trim()).filter(s => s !== "");
  const nums = parts.map(s => parseFloat(s)).filter(n => !isNaN(n));
  if (!nums.length) return null;
  const mean = nums.reduce((a,b)=>a+b,0) / nums.length;
  let sem = 0;
  if (nums.length > 1) {
    const variance = nums.reduce((a,b)=>a+(b-mean)*(b-mean),0) / (nums.length-1);
    sem = Math.sqrt(variance) / Math.sqrt(nums.length);
  }
  return { mean, sem, n: nums.length };
}

function fmt(n, digits = 2) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return n.toFixed(digits);
}

function compute() {
  const rp = document.getElementById("resultPanel");
  const rt = document.getElementById("rthead");
  const rb = document.getElementById("rtbody");
  const cp = document.getElementById("chartPanel");
  const ctrlRow = rows[controlIndex];
  const hint = document.getElementById("resultHint");

  // check if there is any data
  const hasData = rows.some(r => parseCtStats(r.ref) !== null || r.targets.some(v => parseCtStats(v) !== null));
  if (!hasData || !ctrlRow) {
    rp.style.display = "";
    rt.replaceChildren();
    rb.replaceChildren();
    cp.style.display = "none";
    hint.textContent = "输入 Ct 值后，这里会自动生成 ΔCt、ΔΔCt 和 Fold Change。";
    return;
  }

  const ctrlRef = parseCtStats(ctrlRow.ref);
  const ctrlDelta = targetGenes.map((g,ti) => {
    const tg = parseCtStats(ctrlRow.targets[ti]);
    if (ctrlRef === null || tg === null) return null;
    return { dCt: tg.mean - ctrlRef.mean, sem: Math.sqrt(tg.sem*tg.sem + ctrlRef.sem*ctrlRef.sem) };
  });

  const anyReplicates = rows.some(r => {
    const rs = parseCtStats(r.ref); if (rs && rs.n > 1) return true;
    return r.targets.some(v => { const ts = parseCtStats(v); return ts && ts.n > 1; });
  });

  rt.replaceChildren();
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <th>样品</th>
    <th>内参 Ct</th>
    ${targetGenes.map((g,ti)=>`<th colspan="${anyReplicates?5:4}" style="text-align:center;">${esc(g)}</th>`).join("")}
  `;
  rt.appendChild(tr);
  const sub = document.createElement("tr");
  sub.innerHTML = `
    <th></th><th></th>
    ${targetGenes.map(()=>`<th>Ct</th><th>ΔCt</th><th>ΔΔCt</th><th>Fold Change</th>${anyReplicates?'<th>SEM</th>':''}`).join("")}
  `;
  rt.appendChild(sub);

  const chartData = [];
  rb.replaceChildren();
  rows.forEach((row, ri) => {
    const refStats = parseCtStats(row.ref);
    const tr = document.createElement("tr");
    let cells = `<td>${esc(row.name || "样品" + (ri+1))}</td><td>${fmt(refStats ? refStats.mean : null)}</td>`;
    const rowChart = { name: row.name || ("样品" + (ri+1)), values: [] };
    targetGenes.forEach((g,ti) => {
      const tgtStats = parseCtStats(row.targets[ti]);
      const dCt = (refStats !== null && tgtStats !== null) ? tgtStats.mean - refStats.mean : null;
      const semDct = (refStats !== null && tgtStats !== null) ? Math.sqrt(tgtStats.sem*tgtStats.sem + refStats.sem*refStats.sem) : null;
      const dDct = (dCt !== null && ctrlDelta[ti] !== null) ? dCt - ctrlDelta[ti].dCt : null;
      const semDdct = (semDct !== null && ctrlDelta[ti] !== null) ? Math.sqrt(semDct*semDct + ctrlDelta[ti].sem*ctrlDelta[ti].sem) : null;
      const fc = dDct !== null ? Math.pow(2, -dDct) : null;
      let errUp = null, errLow = null;
      if (fc !== null && semDdct !== null && semDdct > 0) {
        errUp = Math.pow(2, -(dDct - semDdct)) - fc;
        errLow = fc - Math.pow(2, -(dDct + semDdct));
      }
      rowChart.values.push({ fold: fc, errUp, errLow });
      let fcClass = "fold-neutral";
      let fcText = "—";
      if (fc !== null) {
        fcText = fc.toFixed(3);
        if (fc > 1.15) fcClass = "fold-up";
        else if (fc < 0.87) fcClass = "fold-down";
      }
      cells += `<td>${fmt(tgtStats ? tgtStats.mean : null)}</td><td class="result">${fmt(dCt)}</td><td class="result">${fmt(dDct)}</td><td class="result ${fcClass}" style="font-weight:600;">${fcText}</td>${anyReplicates?`<td class="result">${semDdct!==null && semDdct>0 ? semDdct.toFixed(3) : "—"}</td>`:''}`;
    });
    tr.innerHTML = cells;
    rb.appendChild(tr);
    chartData.push(rowChart);
  });

  document.getElementById("controlLabel").textContent =
    `对照样品：${ctrlRow.name || "样品" + (controlIndex+1)}  |  对照 ΔCt（${targetGenes.join(", ")}）：${ctrlDelta.map(d=>fmt(d)).join(", ")}`;
  hint.textContent = "";
  rp.style.display = "";
  renderCharts(chartData);
}

// ------------------------------------------------------------------
// SVG bar charts (style modeled after Auto-qPCR matplotlib output)
// ------------------------------------------------------------------
const PALETTE = ["#4e79a7","#f28e2b","#e15759","#76b7b2","#59a14f","#edc948","#b07aa1","#ff9da7","#9c755f","#bab0ac"];

let axisLabelsBySample = [];
let axisLabelsByGene = [];

function renderCharts(chartData) {
  const cp = document.getElementById("chartPanel");
  const cbs = document.getElementById("chartBySample");
  const cbg = document.getElementById("chartByGene");
  const lsb = document.getElementById("legendBySample");
  const lgb = document.getElementById("legendByGene");
  const geneTitle = document.getElementById("geneChartTitle");
  const chartHint = document.getElementById("chartHint");

  if (!chartData.length || !targetGenes.length) { cp.style.display = "none"; return; }

  // series grouped by sample: one bar per gene inside each sample group
  const seriesByGene = targetGenes.map((g, gi) => ({
    name: g,
    color: PALETTE[gi % PALETTE.length],
    values: chartData.map(r => r.values[gi])
  }));
  const seriesBySample = rows.map((r, ri) => ({
    name: r.name || ("样品" + (ri+1)),
    color: PALETTE[ri % PALETTE.length],
    values: targetGenes.map((g, gi) => chartData[ri].values[gi])
  }));

  const anyErr = chartData.some(r => r.values.some(v => v.errUp !== null && v.errUp > 0 || v.errLow !== null && v.errLow > 0));
  chartHint.textContent = anyErr
    ? "误差线由技术重复的 SEM 传播得到（在 Ct 输入框中用逗号分隔多个重复即可启用）。"
    : "只输入单个 Ct 值时不显示误差线；如需误差线，可在 Ct 输入框中用逗号分隔多个技术重复（如 22.1,22.3,22.4）。";

  const hasGeneChart = targetGenes.length > 1;
  geneTitle.style.display = hasGeneChart ? "" : "none";
  lgb.style.display = hasGeneChart ? "" : "none";
  cbg.style.display = hasGeneChart ? "" : "none";

  drawBarChart(cbs, seriesByGene, "RQ (ΔΔCt)", getAxisLabels("sample", chartData.map(r => r.name)));
  if (hasGeneChart) drawBarChart(cbg, seriesBySample, "RQ (ΔΔCt)", getAxisLabels("gene", targetGenes));

  lsb.replaceChildren();
  seriesByGene.forEach(s => {
    const item = document.createElement("span");
    item.className = "legend-item";
    item.innerHTML = `<span class="legend-swatch" style="background:${s.color};"></span>${esc(s.name)}`;
    lsb.appendChild(item);
  });
  if (hasGeneChart) {
    lgb.replaceChildren();
    seriesBySample.forEach(s => {
      const item = document.createElement("span");
      item.className = "legend-item";
      item.innerHTML = `<span class="legend-swatch" style="background:${s.color};"></span>${esc(s.name)}`;
      lgb.appendChild(item);
    });
  }
  cp.style.display = "";
}

function getAxisLabels(which, defaults) {
  const raw = which === "sample"
    ? document.getElementById("axisLabelsSample").value
    : document.getElementById("axisLabelsGene").value;
  const lines = raw.split(/\r?\n/).map(s => s.trim());
  const filled = lines.filter(s => s !== "");
  if (!filled.length) return defaults;
  return defaults.map((d, i) => lines[i] !== undefined && lines[i] !== "" ? lines[i] : d);
}

function toggleAxisEditor(which) {
  const el = which === "sample"
    ? document.getElementById("axisEditorSample")
    : document.getElementById("axisEditorGene");
  el.classList.toggle("show");
  if (el.classList.contains("show")) el.querySelector("textarea").focus();
}

function saveChartAsPng(containerId, fallbackName) {
  const svgEl = document.getElementById(containerId).querySelector("svg");
  if (!svgEl) return;
  const titleInput = containerId === "chartBySample"
    ? document.getElementById("titleBySample")
    : document.getElementById("titleByGene");
  const name = (titleInput.value.trim() || fallbackName) + ".png";
  const xml = new XMLSerializer().serializeToString(svgEl);
  const svgBlob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const canvas = document.createElement("canvas");
    canvas.width = svgEl.viewBox.baseVal.width * scale;
    canvas.height = svgEl.viewBox.baseVal.height * scale;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    canvas.toBlob(blob => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, "image/png");
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    saveChartAsSvg(containerId, fallbackName.replace(/\.png$/, ""));
  };
  img.src = url;
}

function saveChartAsSvg(containerId, fallbackName) {
  const svgEl = document.getElementById(containerId).querySelector("svg");

}

["titleBySample","titleByGene","axisLabelsSample","axisLabelsGene"].forEach(id => {

function drawBarChart(container, series, yLabel, groupNames) {
  const groups = [];
  const groupCount = series[0].values.length;
  for (let i = 0; i < groupCount; i++) groups.push(i);

  const width = 900, height = 420;
  const margin = { top: 20, right: 20, bottom: 70, left: 70 };
  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;

  const allVals = [];
  series.forEach(s => s.values.forEach(v => { if (v.fold !== null) allVals.push(v.fold); if (v.errUp) allVals.push(v.fold + v.errUp); }));
  const maxVal = allVals.length ? Math.max(...allVals) * 1.15 : 1;
  const yMax = Math.max(maxVal, 1.05);

  const xScale = i => margin.left + (i + 0.5) * (innerW / groupCount);
  const groupWidth = innerW / groupCount;
  const barWidth = Math.min(48, groupWidth / (series.length + 0.6));
  const yScale = v => margin.top + innerH - (v / yMax) * innerH;

  let bars = "";
  series.forEach((s, si) => {
    s.values.forEach((v, gi) => {
      if (v.fold === null) return;
      const x = xScale(gi) - (series.length * barWidth) / 2 + si * barWidth;
      const y = yScale(v.fold);
      const h = yScale(0) - y;
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" fill="${s.color}" stroke="white" stroke-width="0.5"/>`;
      if (v.errUp !== null && (v.errUp > 0 || v.errLow > 0)) {
        const cx = x + barWidth / 2;
        const yTop = yScale(v.fold + v.errUp);
        const yBot = yScale(Math.max(v.fold - v.errLow, 0));
        bars += `<line x1="${cx}" y1="${yTop.toFixed(1)}" x2="${cx}" y2="${yBot.toFixed(1)}" stroke="#333" stroke-width="1.4"/>`;
        bars += `<line x1="${(cx-3).toFixed(1)}" y1="${yTop.toFixed(1)}" x2="${(cx+3).toFixed(1)}" y2="${yTop.toFixed(1)}" stroke="#333" stroke-width="1.4"/>`;
        bars += `<line x1="${(cx-3).toFixed(1)}" y1="${yBot.toFixed(1)}" x2="${(cx+3).toFixed(1)}" y2="${yBot.toFixed(1)}" stroke="#333" stroke-width="1.4"/>`;
      }
    });
  });

  // axis lines
  const axisBottom = `<line x1="${margin.left}" y1="${(margin.top+innerH)}" x2="${width-margin.right}" y2="${(margin.top+innerH)}" stroke="#333" stroke-width="1.2"/>`;
  const axisLeft = `<line x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${margin.top+innerH}" stroke="#333" stroke-width="1.2"/>`;

  // y ticks
  const ticks = [];
  const tickCount = 5;
  for (let i = 0; i <= tickCount; i++) {
    const val = yMax * i / tickCount;
    const y = yScale(val);
    ticks.push(`<line x1="${margin.left-4}" y1="${y.toFixed(1)}" x2="${margin.left}" y2="${y.toFixed(1)}" stroke="#333" stroke-width="1"/>`);
    ticks.push(`<text x="${margin.left-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#333">${val.toFixed(1)}</text>`);
  }

  // baseline at 1
  let baseline = "";
  if (yMax > 1) {
    const y = yScale(1);
    baseline = `<line x1="${margin.left}" y1="${y.toFixed(1)}" x2="${width-margin.right}" y2="${y.toFixed(1)}" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>`;
  }

  // x labels (group names)
  const xLabels = groupNames.map((name, i) => `<text x="${xScale(i).toFixed(1)}" y="${margin.top+innerH+18}" text-anchor="middle" font-size="11" fill="#333">${esc(name)}</text>`).join("");

  const svg = `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="qPCR bar chart">
    <rect x="0" y="0" width="${width}" height="${height}" fill="white"/>
    ${baseline}
    ${bars}
    ${axisBottom}
    ${axisLeft}
    ${ticks.join("")}
    ${xLabels}
    <text transform="translate(16,${(margin.top+innerH/2).toFixed(1)}) rotate(-90)" text-anchor="middle" font-size="12" fill="#333">${esc(yLabel)}</text>
  </svg>`;
  container.innerHTML = svg;
}

function copyResults() {
  const table = document.getElementById("resultTable");
  let tsv = [];
  for (const tr of table.rows) {
    const cells = [];
    for (const td of tr.cells) cells.push(td.textContent.trim());
    tsv.push(cells.join("\t"));
  }
  const text = tsv.join("\n");
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById("copyToast");
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1500);
  }).catch(() => {
    // fallback for file:// protocol
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    const toast = document.getElementById("copyToast");
    toast.textContent = "已复制";
    toast.classList.add("show");
    setTimeout(() => { toast.classList.remove("show"); toast.textContent = "已复制到剪贴板"; }, 1500);
  });
}
